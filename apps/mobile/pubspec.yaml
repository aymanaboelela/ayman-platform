  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  dartz: ^0.10.1
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  easy_localization: ^3.0.8
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  go_router: ^17.5.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  photo_view: ^0.15.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  record: ^6.2.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_waveforms: ^2.0.2
  video_player: ^2.11.1
  chewie: ^1.15.0
  skeletonizer: ^2.1.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  permission_handler: ^13.0.2
  app_links: ^7.0.0
  uuid: ^4.6.0
  collection: ^1.19.1
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  flutter_widget_from_html_core: ^0.17.3
  visibility_detector: ^0.4.0+2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    # The generated string table. `ar.json` is authored in
    # packages/contracts/src/copy/ and regenerated by `pnpm mobile:copy`;
    # `en.json` is the same keys with Arabic placeholders, because the language
    # switch is built but deliberately not enabled yet.
    - assets/translations/
    - assets/images/
    - assets/icons/

  fonts:
    # IBM Plex Sans Arabic + IBM Plex Mono, the same two families the web app
    # self-hosts (apps/web/lib/fonts.ts). TTF rather than the web's WOFF2
    # because Flutter cannot read WOFF2 at all.
    #
    # Arabic runs 400/500/600/700; the web also ships Latin-only cuts of
    # 400/600/700 as separate faces, which Flutter has no equivalent for — one
    # family, one weight, one file. The full-family TTFs below carry both
    # scripts, so a Latin word inside an Arabic line still renders in-family
    # instead of falling out to the system font.
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700

    # Mono stops at 600 on purpose — the web's note explains it: its 700 would
    # be another 15 KB to serve a handful of Latin labels, and
    # `font-synthesis-weight: none` stops the browser faking the difference.
    # Flutter fakes it too unless the face exists, so the app asks for 600 by
    # name everywhere the web does.
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600

# ── flutter_launcher_icons ────────────────────────────────────────────────────
# Sources are generated by `pnpm mobile:icons` (scripts/build-mobile-icons.mjs)
# from the portrait in apps/web/public/team/. Run
# `dart run flutter_launcher_icons` after regenerating them.
flutter_launcher_icons:
  # Full-bleed square, no alpha — iOS applies its own squircle and Apple
  # rejects an App Store icon that carries a transparency channel.
  image_path: "assets/icons/app_icon.png"

  android: "ic_launcher"
  # `--n-2` light. The adaptive foreground is drawn on transparency and this is
  # what shows through it, so it has to match the ground the iOS icon is
  # composited onto or the two platforms ship visibly different icons.
  adaptive_icon_background: "#F9F8F6"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  # Android 13+ themed icons. Without this the launcher renders the app as a
  # flat grey blob beside every other themed icon — it takes the ALPHA of the
  # icon and tints it with the wallpaper palette, which turns a photograph into
  # a filled circle. This layer is the `</>` monogram instead.
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"

  ios: true
  # iOS has no notion of a transparent icon; this flattens any alpha onto the
  # ground rather than letting it render black.
  remove_alpha_ios: true

# ── flutter_native_splash ─────────────────────────────────────────────────────
# The frame between the launcher tap and the first Flutter frame. It is not
# decoration: without it the student sees a white (or black) rectangle for
# 300–800ms on a mid-range Android, which is the single most common reason an
# app is described as «بطيء».
flutter_native_splash:
  # `--n-1` in each theme, so the launch screen is already the colour the app
  # will paint and there is no flash at handover.
  color: "#FDFCFB"
  color_dark: "#08090A"
  image: "assets/images/splash_logo.png"

  android_12:
    # Android 12+ ignores the classic splash and draws its own from these.
    # The icon it accepts is masked to a circle and only the inner 2/3 is
    # visible, which is why this points at the splash logo rather than the
    # launcher icon.
    image: "assets/images/splash_logo.png"
    color: "#FDFCFB"
    color_dark: "#08090A"

  # No `android_gravity: fill` / `fullscreen` — the status bar stays visible so
  # the transition into the app does not jump the layout up by its height.
