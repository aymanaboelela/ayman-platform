<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" role="img" aria-label="InstaPay">
  <!--
    ⚠️ PLACEHOLDER WORDMARK — not the official InstaPay mark.

    Drawn here so the payment panel ships with something correct-looking
    rather than a broken image. Replace this single file with the official
    asset from instapay.eg (same path, same viewBox ratio) and nothing in the
    code has to change — `PaymentBrand` only ever points at this path.

    Colours are InstaPay's own violet→magenta, which is what makes the badge
    readable as "the InstaPay app" at a glance; the letterforms are plain
    system-stack text and deliberately make no claim to be the real logotype.
  -->
  <defs>
    <linearGradient id="instapay-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D2E9E" />
      <stop offset="1" stop-color="#C6168D" />
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="32" height="32" rx="9" fill="url(#instapay-g)" />
  <path d="M11 26V14M21 26V19.5a3.5 3.5 0 0 0-7 0" fill="none" stroke="#fff"
        stroke-width="3" stroke-linecap="round" />
  <text x="42" y="26" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="17" font-weight="700" fill="url(#instapay-g)">InstaPay</text>
</svg>
