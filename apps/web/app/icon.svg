<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="منصة أيمن أبو العلا">
  <!--
    The default mark. `app/icon.svg` is a Next file convention: it serves the
    file AND emits the <link rel="icon"> for it, which is what makes the bare
    /favicon.ico request stop mattering — that URL 404'd on production and
    every browser asks for it.

    An SVG rather than an .ico so one file is crisp at 16px in a tab and at
    180px on an iOS home screen. It is overridden at runtime by the admin's
    uploaded favicon when one is set (see the root layout).

    Flat #E9A23B (--a-9) and an 8px radius on a 64px canvas — the design
    system's one accent and its radius ceiling. No gradient, no glow.
  -->
  <rect width="64" height="64" rx="8" fill="#E9A23B"/>
  <path d="M20 46V29.5c0-6.1 4.9-11 11-11h2c6.1 0 11 4.9 11 11V46" fill="none" stroke="#08090A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="32" cy="13" r="3.5" fill="#08090A"/>
</svg>
