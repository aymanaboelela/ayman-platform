# كل طلب = 503 بصفحة الصيانة. 503 مش 200: محرّكات البحث بتفهم إنها مؤقتة،
# وCloudflare مابيخزّنهاش (no-store) — قبل كده الـ404 بتاعة Traefik كانت
# بتفضل متخزّنة بعد ما الموقع يرجع.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "120" always;

    error_page 503 /index.html;
    location = /index.html { internal; }
    location / { return 503; }
}
