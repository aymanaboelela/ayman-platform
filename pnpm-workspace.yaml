packages:
  - 'apps/*'
  - 'packages/*'

# Don't re-verify (and implicitly re-install) dependencies before every script.
# On a slow connection this turns `pnpm lint` into a multi-minute install that
# can time out, blocking every gate. Run `pnpm install` explicitly instead.
verifyDepsBeforeRun: false

# Postinstall scripts are opt-in, one package at a time. Never leave a
# placeholder value here — an unresolved entry blocks every pnpm command
# repo-wide, not just the package it names.
allowBuilds:
  '@prisma/engines': true # query-engine binary
  '@swc/core': true # native compiler for the Nest build/test pipeline
  esbuild: true
  prisma: true # postinstall generates the client
  sharp: true # image re-encoding: strips EXIF, destroys polyglots
  unrs-resolver: true
  # Denied: anonymous usage telemetry. Builds and runs fine without it.
  '@scarf/scarf': false
  argon2: true # native Argon2id binding; ships prebuilt binaries, no compile step

# Forced resolutions. Keep this list short and keep every entry's reason with
# it — an override is a promise that a transitive dependency will work on a
# version its own parent did not ask for, and an unexplained one is impossible
# to retire safely.
overrides:
  # Next 16.2.11 declares `sharp: ^0.34.5` as an OPTIONAL dependency, and a
  # caret on a 0.x version cannot reach 0.35 — so the tree carried TWO sharps:
  # 0.35.3 for @ayman/api (which re-encodes uploaded avatars) and 0.34.5 for
  # Next's image optimiser. 0.34.5 inherits the libvips CVEs covered by the
  # `sharp <0.35.0` advisory, and `next/image` renders student-uploaded avatars
  # (see components/app/user-avatar.tsx) — so that second copy processes
  # attacker-supplied image data at runtime, on the public internet.
  #
  # This pins both to the version the API already runs.
  #
  # ⚠️ Re-check on every Next upgrade. Once Next itself moves to ^0.35 this
  # override is redundant, and an override left in place after it stops being
  # needed pins the ecosystem backwards instead of forwards. Delete it then.
  sharp: 0.35.3

catalog:
  typescript: 5.9.3
  zod: 4.4.3
  '@types/node': 24.10.1

minimumReleaseAgeExclude:
  - nestjs-zod@5.5.0
  - '@hookform/resolvers@5.5.3'
