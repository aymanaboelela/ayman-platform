packages:
  - 'apps/*'
  - 'packages/*'

# Don't re-verify (and implicitly re-install) dependencies before every script.
# On a slow connection this turns `pnpm lint` into a multi-minute install that
# can time out, blocking every gate. Run `pnpm install` explicitly instead.
verifyDepsBeforeRun: false

# Postinstall scripts are opt-in, one package at a time. Never leave a
# placeholder value here — an unresolved entry blocks every pnpm command
# repo-wide, not just the package it names.
allowBuilds:
  '@prisma/engines': true # query-engine binary
  '@swc/core': true # native compiler for the Nest build/test pipeline
  esbuild: true
  prisma: true # postinstall generates the client
  sharp: true # image re-encoding: strips EXIF, destroys polyglots
  unrs-resolver: true
  # Denied: anonymous usage telemetry. Builds and runs fine without it.
  '@scarf/scarf': false
  argon2: true # native Argon2id binding; ships prebuilt binaries, no compile step
  # Denied: its only install script is `opencollective-postinstall`, a donation
  # banner. The WASM and the worker ship prebuilt in the tarball, so the OCR
  # works with the script refused — same call as `@scarf/scarf` above.
  tesseract.js: false

# Forced resolutions. Keep this list short and keep every entry's reason with
# it — an override is a promise that a transitive dependency will work on a
# version its own parent did not ask for, and an unexplained one is impossible
# to retire safely.
overrides:
  # `@nestjs/platform-express` 11.1.28 pins `multer` 2.2.0 exactly, and 2.2.0
  # has three DoS advisories in multipart parsing (GHSA-535w-7cp7-47q4,
  # GHSA-wc9g-mqfw-jrwm, GHSA-3pph-fpjx-jg34) — reachable without a session
  # through `POST /api/book-orders/screenshot`. Same API, minor bump. Delete
  # once Nest's own pin reaches 2.4.
  multer: 2.5.0
  # ── Security pass, 2026-10-25 («ثغرات أمنية في التحديثات»). `pnpm audit`
  #    listed criticals and highs in transitive packages the direct deps pin
  #    loosely; each is forced to the first patched release INSIDE its own
  #    major, so nothing that depends on it sees an API change. Re-run
  #    `pnpm audit --prod` before deleting any line. Left out on purpose: the
  #    ones whose only fix is a new major of a test-only tool (vitest's
  #    tinypool/@vitest/mocker, deepmerge-ts 8) — none of them ships in an
  #    image.
  proxy-addr@<2.0.8: 2.0.8
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  dompurify@<3.4.17: 3.4.17
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  undici@>=7.0.0 <7.30.1: 7.30.1
  fast-xml-parser@<4.5.5: 4.5.7
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  js-yaml@>=5.0.0 <5.2.2: 5.5.0
  brace-expansion@<1.1.20: 1.1.21
  brace-expansion@>=2.0.0 <2.1.6: 2.1.7
  brace-expansion@>=4.0.0 <5.0.11: 5.0.12
  nanoid@<3.3.18: 3.3.20
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  http-cache-semantics@<4.2.1: 4.3.0
  piscina@<4.9.4: 4.9.4
  find-my-way@<9.6.1: 9.10.0
  mysql2@<3.22.0: 3.24.6
  '@xhmikosr/decompress@>=11.0.0 <11.1.4': 11.1.4
  vite@>=7.0.0 <7.3.7: 7.3.7

catalog:
  typescript: 5.9.3
  zod: 4.6.7
  '@types/node': 24.10.1

minimumReleaseAgeExclude:
  - nestjs-zod@5.5.0
  - '@hookform/resolvers@5.5.3'
  - '@anthropic-ai/sdk@0.120.0'
