# المنصة على Dokploy.
#
# ⚠️ مفيش لافتات Traefik مكتوبة بإيد هنا عن قصد. Dokploy بيولّدها بنفسه من
# سجلات الدومين اللي في قاعدته — ولافتات مكتوبة يدويًا جنبها بتتعارض معاها.
# التوجيه بيتظبط من Dokploy:
#
#   aymanaboelela.com        /api    → api   :3300
#   aymanaboelela.com        /       → web   :3200
#   media.aymanaboelela.com  /media  → api   :3300
#
# الشرط المعماري اللي كل ده تحته: **الموقع والـ API على نفس الدومين**. الكوكيز
# بتستخدم بادئة `__Host-` اللي بتشترط أصل واحد، ومفيش CORS متظبط في أي مكان.
# والملفات المرفوعة على دومين تاني — الـ API بيرفض يقلع لو الأصلين اتساووا.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayman_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ayman_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    # مفيش `ports:` عن قصد — الداتابيز مش بتتعرّض للإنترنت.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayman_owner -d ayman_platform']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # حدود الطلبات متخزّنة هنا. من غيره كل نسخة API بيبقى عندها عدّاد لوحدها.
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_PORT: '3300'
      # يقراه docker-entrypoint.sh عشان يعمل/يحدّث الدور المحدود قبل الميجريشن.
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD}
      DATABASE_URL: postgresql://ayman_runtime:${RUNTIME_PASSWORD}@postgres:5432/ayman_platform?schema=app
      DIRECT_DATABASE_URL: postgresql://ayman_owner:${POSTGRES_PASSWORD}@postgres:5432/ayman_platform?schema=app
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      BETTER_AUTH_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # ⚠️ لازم أصل مختلف عن APP_URL — الـ API بيرفض يقلع لو اتساووا.
      MEDIA_BASE_URL: ${MEDIA_ORIGIN}/media
      MEDIA_ROOT: /var/lib/ayman/media
    volumes:
      - media:/var/lib/ayman/media
    networks: [dokploy-network, default]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # بتتحرق في الـ bundle وقت البناء — تغييرها بعدين محتاج إعادة بناء.
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${MEDIA_ORIGIN}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: '3200'
      # داخلي — الويب بيكلّم الـ API على شبكة Docker، مش بيخرج للإنترنت ويرجع.
      API_ORIGIN: http://api:3300
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_MEDIA_ORIGIN: ${MEDIA_ORIGIN}
      CSP_ENFORCE: ${CSP_ENFORCE:-}
    networks: [dokploy-network, default]

# ⚠️ شبكة Traefik بتاعت Dokploy. من غيرها الحاويات بتشتغل تمام بس Traefik
# **مش شايفها** — والدومين بيرد timeout. وده اللي حصل بالظبط أول مرة.
# `external` لأن Dokploy هو اللي عاملها، مش إحنا.
networks:
  dokploy-network:
    external: true
  default: {}

volumes:
  pgdata:
  redisdata:
  # الملفات المرفوعة. لازم تدخل النسخ الاحتياطي مع الداتابيز — الاتنين مع بعض
  # بيمثّلوا حالة المنصة؛ واحد من غير التاني مش نسخة كاملة.
  media:
