# المنصة على Dokploy.
#
# ⚠️ مفيش لافتات Traefik مكتوبة بإيد هنا عن قصد. Dokploy بيولّدها بنفسه من
# سجلات الدومين اللي في قاعدته — ولافتات مكتوبة يدويًا جنبها بتتعارض معاها.
# التوجيه بيتظبط من Dokploy:
#
#   aymanaboelela.com        /api    → api   :3300
#   aymanaboelela.com        /       → web   :3200
#   media.aymanaboelela.com  /media  → api   :3300
#
# الشرط المعماري اللي كل ده تحته: **الموقع والـ API على نفس الدومين**. الكوكيز
# بتستخدم بادئة `__Host-` اللي بتشترط أصل واحد، ومفيش CORS متظبط في أي مكان.
# والملفات المرفوعة على دومين تاني — الـ API بيرفض يقلع لو الأصلين اتساووا.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayman_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ayman_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    # مفيش `ports:` عن قصد — الداتابيز مش بتتعرّض للإنترنت.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayman_owner -d ayman_platform']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # مستخدمين اتنين: حدود الطلبات (الـ API) وكاش `'use cache'` (الويب).
    # من غيره كل نسخة API بيبقى عندها عدّاد لوحدها، وكل نشرة بتصفّي الكاش.
    #
    # ⚠️ `maxmemory` مش تحسين — من غيره Redis افتراضيًا `noeviction`، يعني لما
    # الذاكرة تمتلي **الكتابة بترجع أخطاء**. وساعتها كتابة عدّادات حدود الطلبات
    # بتفشل هي كمان — وهي بتفشل مقفولة، يعني 500 على المنصة كلها، بسبب كاش
    # بيعمل شغله عادي. الكاش بيكبر من غير سقف؛ العدّادات لأ.
    #
    # `volatile-lru` بيشيل المفاتيح اللي ليها TTL بس — وده كل المفاتيح هنا:
    # الكاش بيحط EX، والـ throttler بيحط PEXPIRE. وLRU بيحمي العدّادات من غير
    # ما نقول له: بتتلمس كل طلب، فهي الأحدث استخدامًا دايمًا، والكاش الأبرد هو
    # اللي بيتشال الأول. (`volatile-ttl` كان هيعمل العكس بالظبط — بيشيل أقصر
    # TTL، يعني العدّادات — عشان كده مش مستخدمة.)
    #
    # عدّل السقف حسب ذاكرة السيرفر: REDIS_MAXMEMORY في ملف .env بتاع compose.
    command:
      - 'redis-server'
      # مفيش ديمومة خالص. `--save ""` بيلغي نقاط الحفظ المدمجة (الصورة
      # الافتراضية جاية بـ 3600/300/60)، و`--appendonly no` بيقفل AOF.
      #
      # ⚠️ ده كان `--save 60 1` وبقى غلط بعد ما الكاش دخل: الشرط "مفتاح اتغيّر"
      # كان بيتحقق نادرًا وإحنا شايلين عدّادات بس؛ الكاش بيكتب باستمرار، يعني
      # fork كل دقيقة. والـ fork بينسخ عند الكتابة، على بوكس ٢ جيجا
      # (الحد الأدنى في runbooks/vps-setup.md) وعليه postgres وapi وweb كمان.
      #
      # ومحدش محتاج الديمومة دي: عدّادات الحدود TTL بتاعها قصير، والكاش كاش.
      # أسوأ نتيجة لإعادة تشغيل Redis إن نوافذ الحدود تبدأ من الأول والكاش
      # يبرد — وده بالظبط اللي كان بيحصل كل نشرة قبل ما الكاش يدخل أصلاً.
      - '--save'
      - ''
      - '--appendonly'
      - 'no'
      # سقف مقصود يكون محافظ: البوكس المرجعي ٢ جيجا وعليه أربع خدمات.
      # زوّده من REDIS_MAXMEMORY في ملف .env بتاع compose لو سيرفرك أكبر.
      - '--maxmemory'
      - '${REDIS_MAXMEMORY:-128mb}'
      - '--maxmemory-policy'
      - 'volatile-lru'
    # متسابة موصولة عن قصد رغم إن مفيش كتابة عليها دلوقتي — رجوع الديمومة
    # يبقى تغيير سطر واحد بدل ما يبقى تغيير في التخزين.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_PORT: '3300'
      # يقراه docker-entrypoint.sh عشان يعمل/يحدّث الدور المحدود قبل الميجريشن.
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD}
      DATABASE_URL: postgresql://ayman_runtime:${RUNTIME_PASSWORD}@postgres:5432/ayman_platform?schema=app
      DIRECT_DATABASE_URL: postgresql://ayman_owner:${POSTGRES_PASSWORD}@postgres:5432/ayman_platform?schema=app
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      BETTER_AUTH_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # "كمّل بحساب جوجل". لازم يتكتبوا هنا صراحةً — نفس الفخ بتاع ADMIN_*
      # تحت: متغير في ملف `.env` ومش مذكور في `environment:` عمره ما بيدخل
      # الحاوية، والزرار كان هيرجّع 400 من غير أي رسالة في اللوج.
      #
      # الاتنين مع بعض أو ولا واحد — واحد لوحده بيفشّل الإقلاع.
      # الـ redirect URI المسجّل في Google Cloud لازم يبقى بالظبط:
      #   ${APP_URL}/api/auth/callback/google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # ⚠️ لازم أصل مختلف عن APP_URL — الـ API بيرفض يقلع لو اتساووا.
      MEDIA_BASE_URL: ${MEDIA_ORIGIN}/media
      MEDIA_ROOT: /var/lib/ayman/media
      # الشات الذكي بتاع المساعد (`POST /api/assistant/ask`). التلاتة اختياريين:
      # من غيرهم الشات بيفضل شغّال وبيجاوب من نفس الكلام المكتوب في شجرة
      # الأسئلة، وبيحط زرار «أكلّم م. أيمن» على كل رد.
      #
      # GEMINI_API_KEY هو المجاني وهو الافتراضي (مفتاح من AI Studio من غير
      # كارت). ANTHROPIC_API_KEY هو الترقية المدفوعة، ولو الاتنين موجودين
      # المجاني بيكسب.
      #
      # ⚠️ ونفس الفخ اللي فوق بالظبط: من غير السطور دي، المفتاح ممكن يبقى في
      # ملف `.env` وعمره ما يدخل الحاوية — والشات هيفضل يجاوب من السكريبت
      # من غير ولا رسالة في اللوج تقول ليه.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # الموديلين دول **فاضيين عن قصد**: القايمة الافتراضية في `env.ts`، ولو
      # اتكتبت هنا كمان بتبقى نسختين لازم يفضلوا متطابقين — وده اللي حصل فعلاً:
      # فضلت `gemini-2.5-flash` لوحده هنا بعد ما الافتراضي بقى سلسلة تلات
      # موديلات، فالبرودكشن كان بيستخدم موديل واحد والباقي عمره ما اتنده.
      #
      # ⚠️ و`${VAR:-}` بيحط **سترينج فاضية** مش بيسيب المتغير مش موجود، فأي
      # سطر هنا لازم يكون الاسكيما بتاعته شايلة الفاضي على إنه «مش متظبّط».
      # `optionalWithDefault` في `env.ts` بيعمل كده — والسطر ده من غيره وقّف
      # المنصة كلها ساعة.
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Groq: ١٤٤٠٠ طلب في اليوم مجاني من غير كارت. بيتحط **مع** مفتاح Gemini
      # مش بدله — الاتنين في سلسلة: Gemini بيصرف عشرين رد بعربي أحسن، وGroq
      # بيكمّل باقي اليوم.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # بوت حساب الأدمن الأول. `docker-entrypoint.sh` بيشغّله بس لو الاتنين
      # موجودين، وبـ`ADMIN_ONLY_IF_MISSING=true` — يعني مبيلمسش أدمن موجود.
      #
      # ⚠️ لازم يتكتبوا هنا صراحةً. ملف `.env` بتاع الـcompose بيتقري وقت
      # الـsubstitution بتاع `${...}` وبس؛ متغير موجود فيه ومش مذكور في
      # `environment:` **عمره ما بيدخل الحاوية**. ده بالظبط اللي خلّى أول
      # محاولة بوت تفشل بصمت والدخول يرجع "الإيميل أو الباسورد غلط".
      #
      # سيبهم فاضيين بعد ما الحساب يتعمل — القيمة الفاضية بتوقّف البوت أصلاً.
      # التسويق — مرسل الواتساب. الاتنين مع بعض أو ولا واحد (الـ API بيرفض
      # يقلع لو واحد بس موجود): URL من غير توكن معناه خدمة بترد 401 على كل
      # إرسال، يعني حملة بتفشل من أول رقم وشكلها باگ في الحملة مش متغير ناقص.
      #
      # سيبهم فاضيين وقسم التسويق بيقول «مفيش رقم مربوط» ويشرح الخطوة —
      # وده الافتراضي المقصود: المنصة متبعتش من موبايل حد غير لما حد يقرر ده
      # صراحةً.
      WA_SERVICE_URL: ${WA_SERVICE_URL:-}
      WA_SERVICE_TOKEN: ${WA_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    volumes:
      - media:/var/lib/ayman/media
    networks: [dokploy-network, default]

  # مرسل الواتساب. جهاز واحد مربوط، بيبعت رسالة واحدة لما الـ API يطلب.
  #
  # اتشالت مؤقتًا يوم ٢٠٢٦-٠٨-٢٤ بعد ما ديبلوي `main` وقف ٢٢+ دقيقة، على
  # ظن (متأكدش فعليًا) إن الصورة دي هي السبب — الصورة دي عمرها ما كانت
  # اتبنت في أي حتة قبل كده. اتبنت وتاتأكدت محليًا دلوقتي (`docker build
  # ./services/wa`): ~٩٠ ثانية باردة، من غير أي كاش. السبب الحقيقي إن
  # البيلد كان بيقع فورًا (مش بيعلّق) بـ`spawn git ENOENT` — Baileys
  # بيعتمد على `libsignal: github:WhiskeySockets/libsignal-node`، وnpm
  # محتاج `git` موجود عشان يجيبها، و`node:22-slim` مالوش git. الحل في
  # `services/wa/Dockerfile`: `apt-get install git`. الحملة كانت هتفشل
  # في ثوانٍ لو اتحطت أصلاً، مش هي سبب الـ٢٢ دقيقة.
  #
  # ⚠️ `networks: [default]` بس — **من غير** dokploy-network عن قصد. الخدمة
  # دي تقدر تبعت رسايل باسم المهندس من رقمه؛ مالهاش أي سبب تكون موصولة بشبكة
  # الراوتر اللي بتوصل للإنترنت. الـ API بيوصلها على `http://wa:3400` جوه
  # الشبكة الداخلية وبس.
  #
  # مفيش `profiles:` — الخدمة بتقوم دايمًا وبتفضل «مش مربوطة» لحد ما حد يمسح
  # الـ QR. حاوية نايمة أرخص بكتير من deploy تاني وقت ما تكون محتاجها.
  wa:
    build:
      context: ./services/wa
    restart: unless-stopped
    environment:
      WA_PORT: '3400'
      WA_TOKEN: ${WA_TOKEN:-}
      WA_AUTH_DIR: /var/lib/ayman/wa
      # الردود الواردة بتترمي هنا عشان «قف» توقّف الحملة فعلاً. داخلي.
      WA_INBOUND_URL: http://api:3300/api/marketing/wa/inbound # gitleaks:allow — an internal route path, not a secret
      WA_LOG_LEVEL: ${WA_LOG_LEVEL:-warn}
    volumes:
      # ⚠️ الأهم في الملف ده. بيانات الاقتران هنا — من غير الـ volume كل نشرة
      # بتفصل الرقم وتطلب مسح QR من تاني.
      - wasession:/var/lib/ayman/wa
    networks: [default]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # بتتحرق في الـ bundle وقت البناء — تغييرها بعدين محتاج إعادة بناء.
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${MEDIA_ORIGIN}
        # مشروع Clarity الحقيقي هو الافتراضي هنا عن قصد: من غير كده كل نشرة
        # على سيرفر ما اتضبطش فيه المتغير دي بتطلع من غير تسجيل جلسات خالص،
        # والداشبورد بتقول «مفيش داتا» من غير أي إشارة إن السبب هو الإعداد.
        # حط `CLARITY_PROJECT_ID=` فاضي في .env لو عايز توقّفه.
        NEXT_PUBLIC_CLARITY_PROJECT_ID: ${CLARITY_PROJECT_ID-y1hu9w4lii}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: '3200'
      # داخلي — الويب بيكلّم الـ API على شبكة Docker، مش بيخرج للإنترنت ويرجع.
      API_ORIGIN: http://api:3300
      # كاش `'use cache'`. من غيره كل نشرة بتصفّي الكاش، و`getBranding()`
      # بتتقرا في الـ root layout يعني على مسار كل صفحة.
      #
      # ⚠️ وقت التشغيل بس — **مش** build arg. الـ handler بيشتغل بالذاكرة لما
      # المتغير ده مش موجود، وده بالظبط اللي بيخلي `next build` جوه Docker
      # ينجح من غير Redis.
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_MEDIA_ORIGIN: ${MEDIA_ORIGIN}
      CSP_ENFORCE: ${CSP_ENFORCE:-}
    networks: [dokploy-network, default]

# ⚠️ شبكة Traefik بتاعت Dokploy. من غيرها الحاويات بتشتغل تمام بس Traefik
# **مش شايفها** — والدومين بيرد timeout. وده اللي حصل بالظبط أول مرة.
# `external` لأن Dokploy هو اللي عاملها، مش إحنا.
networks:
  dokploy-network:
    external: true
  default: {}

volumes:
  pgdata:
  redisdata:
  # الملفات المرفوعة. لازم تدخل النسخ الاحتياطي مع الداتابيز — الاتنين مع بعض
  # بيمثّلوا حالة المنصة؛ واحد من غير التاني مش نسخة كاملة.
  media:
  # بيانات اقتران الواتساب. **متتاخدش نسخة احتياطي منها** — دي مفاتيح جهاز
  # مربوط، ونسخة قديمة منها لو رجعت بتحاول تقلّد جهاز واتساب فاصلها بالفعل،
  # وده أسرع طريق لفصل الرقم نهائيًا. لو ضاعت: امسح QR تاني، تلات ثواني.
  wasession:
